{% extends 'base.html' %}
{% block auth_content %}
<div class="min-h-screen w-full flex items-center justify-center p-6 bg-[#fafafa]">

    <div class="w-full max-w-[440px] animate-in fade-in zoom-in-95 duration-500">

        <!-- Main Card -->
        <div class="bg-white border border-zinc-200 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden">

            <!-- Minimalist Header -->
            <div class="pt-10 pb-6 text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-zinc-900 rounded-2xl text-white mb-4 shadow-lg shadow-zinc-200">
                    <i class="fas fa-id-card-clip text-lg"></i>
                </div>
                <h1 class="text-xl font-bold text-zinc-900 tracking-tight">Console Authentication</h1>
                <p class="text-xs text-zinc-500 mt-1 font-medium">Step 2: Provide administrative credentials</p>
            </div>

            <!-- Handshake Stepper (Refined) -->
            <div class="px-10 py-4 flex items-center justify-center gap-3">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-[10px] border border-emerald-100">
                        <i class="fas fa-check"></i>
                    </div>
                    <div class="h-[1px] w-8 bg-emerald-100"></div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[10px] ring-4 ring-zinc-50">
                        2
                    </div>
                    <div class="h-[1px] w-8 bg-zinc-100"></div>
                </div>
                <div class="w-6 h-6 rounded-full bg-zinc-50 text-zinc-300 flex items-center justify-center text-[10px] border border-zinc-100">
                    3
                </div>
            </div>

            <!-- Form Content -->
            <div class="px-10 pb-10 pt-6">
                <form method="POST" class="space-y-6">
                    <!-- Username -->
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider ml-1">Administrator ID</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-400">
                                <i class="fas fa-user text-xs"></i>
                            </div>
                            <input type="text" name="username" required placeholder="admin"
                                class="w-full pl-10 pr-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-zinc-900 focus:bg-white transition-all text-sm font-medium text-zinc-900 placeholder:text-zinc-300">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider ml-1">Master Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-400">
                                <i class="fas fa-key text-xs"></i>
                            </div>
                            <input type="password" name="password" required placeholder="••••••••"
                                class="w-full pl-10 pr-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-zinc-900 focus:bg-white transition-all text-sm font-medium text-zinc-900 placeholder:text-zinc-300">
                        </div>
                    </div>

                    {% if error %}
                        <div class="flex items-center gap-2 text-red-600 bg-red-50 p-3 rounded-xl border border-red-100 animate-shake">
                            <i class="fas fa-circle-exclamation text-xs"></i>
                            <p class="text-[11px] font-bold uppercase tracking-tight">{{ error }}</p>
                        </div>
                    {% endif %}

                    <button type="submit" class="w-full py-4 bg-zinc-900 text-white rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-black active:scale-[0.98] transition-all shadow-md shadow-zinc-200">
                        Authorize Access
                    </button>
                </form>
            </div>

            <!-- Simplified Bento Footer -->
            <div class="bg-zinc-50/50 p-5 border-t border-zinc-100 grid grid-cols-2 gap-3">
                <div class="flex items-center gap-3 px-3">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                    <div>
                        <p class="text-[10px] font-bold text-zinc-900 uppercase">PIN Verified</p>
                        <p class="text-[9px] text-zinc-400 font-medium">Stage 01 Clean</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 px-3 border-l border-zinc-200">
                    <i class="fas fa-link text-zinc-400 text-xs"></i>
                    <div>
                        <p class="text-[10px] font-bold text-zinc-900 uppercase">Secure Link</p>
                        <p class="text-[9px] text-zinc-400 font-medium">AES-256 Enabled</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Back Link -->
        <div class="mt-8 text-center">
            <a href="/logout" class="text-[11px] font-bold text-zinc-400 hover:text-zinc-900 transition-colors uppercase tracking-widest flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left-long text-[10px]"></i>
                Reset Handshake
            </a>
        </div>
    </div>
</div>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }

    input::placeholder { font-weight: 400; opacity: 0.6; }
</style>
{% endblock %}
