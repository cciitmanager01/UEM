{% extends 'base.html' %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center p-6 bg-slate-50 relative overflow-hidden">
    <!-- Technical Background Pattern (Matches PIN Gate) -->
    <div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#020617 1px, transparent 1px); background-size: 30px 30px;"></div>

    <div class="relative z-10 w-full max-w-[460px]">
        <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-[0_20px_50px_rgba(2,6,23,0.05)] overflow-hidden">

            <!-- Security Header -->
            <div class="p-8 pb-0 text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-950 rounded-2xl text-emerald-400 mb-6 shadow-xl shadow-slate-200 ring-1 ring-white/10">
                    <i class="fas fa-user-shield text-2xl"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tighter uppercase italic">CCI.UEM ACCESS</h1>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mt-1">2nd Layer Authentication</p>
            </div>

            <!-- Handshake Progress (Step 2 Active) -->
            <div class="px-10 py-8">
                <div class="flex items-center justify-between mb-10 relative">
                    <div class="absolute top-5 left-0 w-full h-[2px] bg-slate-100 -z-10"></div>

                    <!-- Step 1: Completed -->
                    <div class="flex flex-col items-center gap-2">
                        <div class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs border-4 border-white shadow-sm">
                            <i class="fas fa-check"></i>
                        </div>
                        <span class="text-[9px] font-black text-emerald-600 uppercase">PIN_Verified</span>
                    </div>
                    <!-- Step 2: Active -->
                    <div class="flex flex-col items-center gap-2">
                        <div class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs border-4 border-white shadow-[0_0_15px_rgba(15,23,42,0.2)] animate-pulse">
                            <i class="fas fa-id-card-clip"></i>
                        </div>
                        <span class="text-[9px] font-black text-slate-900 uppercase">Credentials</span>
                    </div>
                    <!-- Step 3: Pending -->
                    <div class="flex flex-col items-center gap-2 opacity-30">
                        <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center text-xs border-4 border-white">
                            <i class="fas fa-terminal"></i>
                        </div>
                        <span class="text-[9px] font-black text-slate-400 uppercase">Console</span>
                    </div>
                </div>

                <form method="POST" class="space-y-5">
                    <!-- Username -->
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Administrator ID</label>
                        <div class="relative mt-2">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i class="fas fa-terminal text-[10px]"></i>
                            </div>
                            <input type="text" name="username" required placeholder="UID-ADMIN-01"
                                class="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-slate-950 focus:bg-white focus:ring-8 focus:ring-slate-900/5 transition-all duration-300 text-sm font-bold text-slate-900 placeholder:text-slate-200">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Master Password</label>
                        <div class="relative mt-2">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i class="fas fa-key text-[10px]"></i>
                            </div>
                            <input type="password" name="password" required placeholder="••••••••"
                                class="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-slate-950 focus:bg-white focus:ring-8 focus:ring-slate-900/5 transition-all duration-300 text-sm font-bold text-slate-900 placeholder:text-slate-200">
                        </div>
                    </div>

                    {% if error %}
                        <div class="flex items-center justify-center gap-2 text-red-500 bg-red-50 py-3 rounded-2xl border border-red-100 animate-shake">
                            <i class="fas fa-shield-exclamation text-xs"></i>
                            <p class="text-[10px] font-black uppercase tracking-tight">{{ error }}</p>
                        </div>
                    {% endif %}

                    <button type="submit" class="group w-full py-5 bg-slate-900 text-white rounded-2xl font-bold text-xs uppercase tracking-[0.2em] hover:bg-black hover:shadow-2xl hover:shadow-slate-300 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-3">
                        Decrypt Console
                        <i class="fas fa-unlock-keyhole text-[10px] group-hover:scale-125 transition-transform"></i>
                    </button>
                </form>
            </div>

            <!-- Bento Diagnostic Footer (Matches PIN Gate) -->
            <div class="bg-slate-50 p-6 border-t border-slate-100 grid grid-cols-2 gap-4">
                <div class="bg-white p-3 rounded-2xl border border-slate-200/60 shadow-sm flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-slate-950 text-emerald-400 flex items-center justify-center text-[10px]">
                        <i class="fas fa-fingerprint"></i>
                    </div>
                    <div>
                        <p class="text-[8px] font-black text-slate-400 uppercase leading-none">Identity</p>
                        <p class="text-[9px] font-bold text-slate-900 mt-1 uppercase">Confirmed</p>
                    </div>
                </div>
                <div class="bg-white p-3 rounded-2xl border border-slate-200/60 shadow-sm flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-slate-950 text-sky-400 flex items-center justify-center text-[10px]">
                        <i class="fas fa-vault"></i>
                    </div>
                    <div>
                        <p class="text-[8px] font-black text-slate-400 uppercase leading-none">Security</p>
                        <p class="text-[9px] font-bold text-slate-900 mt-1 uppercase">Layer_02</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 flex items-center justify-center gap-6">
            <a href="/logout" class="group flex items-center gap-2 text-[10px] font-black text-slate-400 hover:text-red-500 transition-colors uppercase tracking-[0.2em]">
                <i class="fas fa-power-off transition-transform group-hover:rotate-90"></i>
                Reset Handshake
            </a>
        </div>
    </div>
</div>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.3s ease-in-out; }
</style>
{% endblock %}
