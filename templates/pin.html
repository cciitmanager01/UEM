{% extends 'base.html' %}
{% block auth_content %}
<div class="min-h-screen w-full flex items-center justify-center p-6 bg-[#fafafa]">

    <div class="w-full max-w-[420px] animate-in fade-in zoom-in-95 duration-500">

        <!-- Main Card -->
        <div class="bg-white border border-zinc-200 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden">

            <!-- Minimalist Header -->
            <div class="pt-10 pb-6 text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-zinc-900 rounded-2xl text-white mb-4 shadow-lg shadow-zinc-200">
                    <i class="fas fa-fingerprint text-lg"></i>
                </div>
                <h1 class="text-xl font-bold text-zinc-900 tracking-tight">System Handshake</h1>
                <p class="text-xs text-zinc-500 mt-1 font-medium">Step 1: Identity Verification Required</p>
            </div>

            <!-- Handshake Stepper (Linear Style) -->
            <div class="px-10 py-4 flex items-center justify-center gap-3">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[10px] ring-4 ring-zinc-50">
                        1
                    </div>
                    <div class="h-[1px] w-8 bg-zinc-100"></div>
                </div>
                <div class="w-6 h-6 rounded-full bg-zinc-50 text-zinc-300 flex items-center justify-center text-[10px] border border-zinc-100">
                    2
                </div>
                <div class="h-[1px] w-8 bg-zinc-100"></div>
                <div class="w-6 h-6 rounded-full bg-zinc-50 text-zinc-300 flex items-center justify-center text-[10px] border border-zinc-100">
                    3
                </div>
            </div>

            <!-- PIN Input Area -->
            <div class="px-10 pb-10 pt-6">
                <form id="pin-form" method="POST" class="space-y-6 text-center">
                    <div class="space-y-4">
                        <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-widest block">Security PIN</label>

                        <div class="relative">
                            <input type="password" name="pin" id="pin-input" maxlength="4"
                                placeholder="••••" autofocus autocomplete="off"
                                class="w-full text-center text-4xl tracking-[0.6em] font-mono font-bold py-5 bg-zinc-50 border border-zinc-200 rounded-2xl text-zinc-900 placeholder:text-zinc-200 focus:border-zinc-900 focus:bg-white transition-all outline-none">

                            <!-- Status Spinner -->
                            <div id="pin-spinner" class="absolute right-5 top-1/2 -translate-y-1/2 hidden">
                                <i class="fas fa-circle-notch animate-spin text-zinc-400 text-sm"></i>
                            </div>
                        </div>
                    </div>

                    {% if error %}
                        <div class="flex items-center justify-center gap-2 text-red-600 bg-red-50 py-3 rounded-xl border border-red-100 animate-shake">
                            <i class="fas fa-circle-exclamation text-xs"></i>
                            <p class="text-[11px] font-bold uppercase tracking-tight">{{ error }}</p>
                        </div>
                    {% endif %}

                    <button type="submit" id="auth-btn" class="w-full py-4 bg-zinc-900 text-white rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-black active:scale-[0.98] transition-all shadow-md shadow-zinc-200">
                        Authenticate PIN
                    </button>
                </form>
            </div>

            <!-- Metadata Footer -->
            <div class="bg-zinc-50/50 p-5 border-t border-zinc-100 flex items-center justify-between px-8">
                <div class="flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wide">AES-256 Link</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="fas fa-tower-broadcast text-zinc-400 text-[10px]"></i>
                    <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wide">Gateway Live</span>
                </div>
            </div>
        </div>

        <!-- Security Disclaimer -->
        <p class="mt-8 text-center text-[10px] font-bold text-zinc-400 uppercase tracking-[0.2em]">
            Authorized Personnel Only <br>
            <span class="opacity-60">Handshake protocols logged via IP</span>
        </p>
    </div>
</div>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }

    input::placeholder { letter-spacing: 0.1em; opacity: 0.4; }
</style>

<script>
    const input = document.getElementById('pin-input');
    const form = document.getElementById('pin-form');
    const spinner = document.getElementById('pin-spinner');
    const btn = document.getElementById('auth-btn');

    input.addEventListener('input', (e) => {
        if (e.target.value.length === 4) {
            // UI Feedback
            input.readOnly = true;
            input.classList.add('opacity-50');
            spinner.classList.remove('hidden');
            btn.innerText = "Verifying Identity...";
            btn.classList.add('bg-zinc-700');

            // Automatic submit after visual delay
            setTimeout(() => form.submit(), 400);
        }
    });
</script>
{% endblock %}
